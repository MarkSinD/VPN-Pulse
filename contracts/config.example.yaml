version: 1

app:
  default_language: en
  languages:
    - en
    - ru
  timezone: UTC
  admin_contact_url: https://t.me/example_admin
  public_url: https://monitor.example.org/app/mvp.html   # the bot's /start button opens this

storage:
  database: /var/lib/vpn-pulse/vpnpulse.sqlite3      # shared by the API and `vpn-pulse run`

telegram:
  bot_token_file: /etc/vpn-pulse/secrets/telegram-bot.token   # 0600; the token itself is never in this file
  group_chat_id: "-1001234567890"                              # the members' group (example value)
  open_url: https://t.me/example_bot/status   # the button under every message; omit it for no button
  admin_chat_id: "123456789"                                   # optional; defaults to the group

# Self-service profile management is fail-closed. Enabling these switches does not grant access;
# members and per-server grants are managed separately. Keep issuance off until a provisioner and
# address pool have passed their live acceptance test.
access:
  member_registry_enabled: false
  grants_enabled: false
  issuance_enabled: false
  address_quarantine_hours: 24
  leave_grace_hours: 24
  pool_low_percent: 10

servers:
  - id: primary-vpn
    type: awg-host
    name:
      ru: Основной сервер
      en: Primary server
    country_code: NL
    enabled: true
    recommended_priority: 10
    collector_ref: collector-primary
    access:
      issuance_enabled: false
      maintenance: false

  - id: backup-vpn
    type: awg-docker
    name:
      ru: Резервный сервер
      en: Backup server
    country_code: FI
    enabled: true
    recommended_priority: 20
    collector_ref: collector-backup
    access:
      issuance_enabled: false
      maintenance: false

monitoring:
  collection_interval_seconds: 60
  pc_target_interval_seconds: 60
  probe_deadline_seconds: 20
  confirmations: 2
  quiet_notice_seconds: 600   # a degraded spell shorter than this is never sent to the administrator
  freshness_seconds: 180

retention:
  observations_days: 7
  aggregates_days: 90
  events_days: 180
  analytics_raw_days: 30
  audit_days: 365

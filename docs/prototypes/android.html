<style>
/* VPN Pulse — shared UI tokens (Mini App, onboarding showcase, Android web mock).
   v5 "instrument panel": near-black glass in the dark theme, iOS-clean grouped background in the
   light theme, lamp colours for states, engraved hairlines, gauge rings with flags.
   The palette is the product's own; Telegram only decides light vs dark (colorScheme) and receives
   the background via setHeaderColor. Type scale uses rem so system text scaling (200%) is respected.
   Every colour pair used for text is >= 4.5:1, control boundaries >= 3:1 (scripts/check_contrast.py).

   Surfaces: --color-bg (page) < --color-surface (cards) < --color-raised (selected / lifted);
   --color-well is the recessed track under segmented controls, code and text fields. */
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-xs: 0.75rem;   /* 12 */
  --text-sm: 0.875rem;  /* 14 */
  --text-md: 1rem;      /* 16 */
  --text-lg: 1.25rem;   /* 20 */
  --text-xl: 1.5rem;    /* 24 */
  --lh-tight: 1.2;
  --lh-caption: 1.4;
  --lh-normal: 1.5;
  --control-min: 44px;
  --row-min: 72px;
  --accordion-min: 48px;
  --ring-size: 64px;
  --ring-size-sm: 48px;
  --focus-width: 2px;
  --motion-fast: 140ms;
  --motion-normal: 180ms;
  --content-max: 560px;
  --content-wide: 960px;

  /* light — clean grouped background, white cards, graphite controls */
  --color-bg: #f2f2f7;
  --color-surface: #ffffff;
  --color-raised: #ffffff;
  --color-well: #e5e5ea;
  --color-text: #1c1c1e;
  --color-muted: #66666d;
  --color-accent: #2c2c2e;
  --color-accent-text: #f5f5f7;
  --color-border: rgba(60, 60, 67, 0.14);
  --color-border-strong: rgba(60, 60, 67, 0.6);
  --line-dark: rgba(60, 60, 67, 0.16);
  --line-light: rgba(255, 255, 255, 0.7);
  --color-operational: #14713d;
  --color-degraded: #8a5200;
  --color-unavailable: #b3261e;
  --color-unknown: #5f6670;
  --color-admin: #5b3fc4;
  --tint: 12%;
  --color-focus: var(--color-accent);
  --metal: linear-gradient(180deg, #4d535a 0%, #2f353b 55%, #23282d 100%);
  --metal-pressed: linear-gradient(180deg, #23282d 0%, #2f353b 100%);
  --metal-edge: inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 -1px 0 rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.25);
  --card-edge: 0 0 0 1px rgba(60, 60, 67, 0.08);
  --panel-inset: inset 0 1px 2px rgba(60, 60, 67, 0.12);
  --lamp-glow: 0 0 0 1px rgba(60, 60, 67, 0.08);
  --shadow-float: 0 8px 24px rgba(28, 28, 30, 0.18);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg: #0b0c0e;
    --color-surface: #1c1c1e;
    --color-raised: #2c2c2e;
    --color-well: #131315;
    --color-text: #f5f5f7;
    --color-muted: #9a9aa1;
    --color-accent: #dcdce1;
    --color-accent-text: #0b0c0e;
    --color-border: rgba(255, 255, 255, 0.1);
    --color-border-strong: rgba(255, 255, 255, 0.38);
    --line-dark: rgba(0, 0, 0, 0.6);
    --line-light: rgba(255, 255, 255, 0.08);
    --color-operational: #30d158;
    --color-degraded: #ff9f0a;
    --color-unavailable: #ff453a;
    --color-unknown: #a1a1a8;
    --color-admin: #bf9fff;
    --tint: 16%;
    --metal: linear-gradient(180deg, #eeece8 0%, #d2d3d3 55%, #bfc1c3 100%);
    --metal-pressed: linear-gradient(180deg, #bfc1c3 0%, #d2d3d3 100%);
    --metal-edge: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -1px 0 rgba(0, 0, 0, 0.28), 0 1px 2px rgba(0, 0, 0, 0.55);
    --card-edge: 0 0 0 1px rgba(255, 255, 255, 0.05);
    --panel-inset: inset 0 1px 2px rgba(0, 0, 0, 0.6);
    --lamp-glow: 0 0 6px color-mix(in srgb, currentColor 55%, transparent);
    --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.6);
  }
}

:root[data-theme="dark"] {
  --color-bg: #0b0c0e;
  --color-surface: #1c1c1e;
  --color-raised: #2c2c2e;
  --color-well: #131315;
  --color-text: #f5f5f7;
  --color-muted: #9a9aa1;
  --color-accent: #dcdce1;
  --color-accent-text: #0b0c0e;
  --color-border: rgba(255, 255, 255, 0.1);
  --color-border-strong: rgba(255, 255, 255, 0.38);
  --line-dark: rgba(0, 0, 0, 0.6);
  --line-light: rgba(255, 255, 255, 0.08);
  --color-operational: #30d158;
  --color-degraded: #ff9f0a;
  --color-unavailable: #ff453a;
  --color-unknown: #a1a1a8;
  --color-admin: #bf9fff;
  --tint: 16%;
  --metal: linear-gradient(180deg, #eeece8 0%, #d2d3d3 55%, #bfc1c3 100%);
  --metal-pressed: linear-gradient(180deg, #bfc1c3 0%, #d2d3d3 100%);
  --metal-edge: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -1px 0 rgba(0, 0, 0, 0.28), 0 1px 2px rgba(0, 0, 0, 0.55);
  --card-edge: 0 0 0 1px rgba(255, 255, 255, 0.05);
  --panel-inset: inset 0 1px 2px rgba(0, 0, 0, 0.6);
  --lamp-glow: 0 0 6px color-mix(in srgb, currentColor 55%, transparent);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.6);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-fast: 1ms;
    --motion-normal: 1ms;
  }
}

/* VPN Pulse Probe — Android mock (web prototype of the native flow). Tokens shared with the Mini App. */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: var(--text-md); line-height: var(--lh-normal); overflow: hidden; display: flex; flex-direction: column; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: .5; }
:focus { outline: none; }
:focus-visible { outline: var(--focus-width) solid var(--color-focus); outline-offset: 2px; border-radius: var(--radius-sm); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.28em; }
.showcase { flex: none; background: #1f2430; color: #e6e9ef; font-size: 13px; padding: 8px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-bottom: 3px dashed #4b5568; font-family: var(--font-mono); }
.showcase .sc-label { font-weight: 700; text-transform: uppercase; font-size: 11px; color: #9aa4b5; letter-spacing: .04em; }
.showcase select, .showcase .sc-btn { background: #2b3242; color: #e6e9ef; border: 1px solid #4b5568; border-radius: 6px; padding: 4px 8px; min-height: 32px; font: inherit; }
.showcase .sc-btn[aria-pressed="true"] { background: #4b7bec; border-color: #4b7bec; color: #fff; }
body[data-showcase="hidden"] .showcase { display: none; }
.device { flex: 1; min-height: 0; width: 100%; max-width: 480px; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--color-bg); }
.appbar { display: grid; grid-template-columns: var(--control-min) minmax(0, 1fr) auto; align-items: center; gap: var(--space-2); padding: calc(var(--space-1) + env(safe-area-inset-top, 0px)) var(--space-3) var(--space-1); min-height: 56px; background: var(--color-bg); border-bottom: 1px solid var(--line-dark); box-shadow: 0 1px 0 var(--line-light); position: relative; z-index: 1; }
.appbar .ttl { font-weight: 700; font-size: var(--text-md); min-width: 0; }
.appbar .ttl small { display: block; font-weight: 400; font-size: var(--text-xs); color: var(--color-muted); }
.icon-btn { width: var(--control-min); height: var(--control-min); display: inline-grid; place-items: center; border-radius: 50%; color: var(--color-text); }
.icon-btn .i { width: 22px; height: 22px; }
.icon-btn.hidden { visibility: hidden; }
.lang-btn { min-width: var(--control-min); height: var(--control-min); padding: 0 var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 700; letter-spacing: .06em; color: var(--color-text); border: 1px solid var(--color-border-strong); box-shadow: inset 0 1px 0 var(--line-light); }
.content { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; -ms-overflow-style: none; padding: var(--space-4) var(--space-4) calc(var(--space-6) + env(safe-area-inset-bottom, 0px)); display: grid; gap: var(--space-4); align-content: start; }
.content::-webkit-scrollbar { width: 0; height: 0; }
.stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-1); }
.stepper div { display: grid; gap: 6px; font-size: var(--text-xs); color: var(--color-muted); text-align: center; }
.stepper i { height: 4px; border-radius: 2px; background: var(--color-border); display: block; }
.stepper div[data-on="true"] { color: var(--color-text); font-weight: 700; }
.stepper div[data-on="true"] i, .stepper div[data-done="true"] i { background: var(--color-accent); }
h1 { font-size: var(--text-xl); line-height: 1.2; margin: 0; font-weight: 700; }
h2 { font-size: var(--text-lg); margin: 0; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--color-muted); }
.small { font-size: var(--text-sm); }
.field { display: grid; gap: 6px; }
.field label { font-size: var(--text-sm); color: var(--color-muted); }
.field input { min-height: 48px; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 0 var(--space-3); background: var(--color-surface); box-shadow: var(--panel-inset); font-family: var(--font-mono); font-size: 18px; letter-spacing: .08em; width: 100%; }
.field input[aria-invalid="true"] { border-color: var(--color-unavailable); }
.field .err { font-size: var(--text-sm); color: var(--color-unavailable); }
.btn { min-width: 0; min-height: 48px; padding: 0 var(--space-4); border-radius: 24px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); border: 1px solid transparent; transition: transform var(--motion-fast); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--metal); color: var(--color-accent-text); box-shadow: var(--metal-edge); }
.btn-primary:active { background: var(--metal-pressed); box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.35); }
.btn-tonal { background: color-mix(in srgb, var(--color-accent) 14%, transparent); color: var(--color-accent); }
.btn-outline { border-color: var(--color-border-strong); }
.btn-danger { color: var(--color-unavailable); border-color: color-mix(in srgb, var(--color-unavailable) 40%, transparent); }
.btn-block { width: 100%; }
.card { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-4); display: grid; gap: var(--space-3); box-shadow: var(--panel-inset); }
.status-card { text-align: center; gap: var(--space-2); }
.status-card .big { font-size: var(--text-lg); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.status-card .big .i { width: 22px; height: 22px; }
.status-card .acts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-top: var(--space-1); }
.kv { display: grid; font-size: var(--text-sm); }
.kv > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); padding: var(--space-2) 0; border-top: 1px solid var(--color-border); align-items: baseline; }
.kv > div:first-child { border-top: 0; padding-top: 0; }
.kv > div:last-child { padding-bottom: 0; }
.kv .k small { display: block; color: var(--color-muted); font-size: var(--text-xs); }
.kv .v { color: var(--color-muted); text-align: right; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.kv .v.ok { color: var(--color-operational); font-weight: 700; } .kv .v.bad { color: var(--color-unavailable); font-weight: 700; } .kv .v.unk { color: var(--color-unknown); font-weight: 700; }
.banner { border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: grid; grid-template-columns: auto 1fr; gap: var(--space-3); font-size: var(--text-sm); align-items: start; }
.banner .i { width: 20px; height: 20px; margin-top: 1px; }
.banner-warn { background: color-mix(in srgb, var(--color-degraded) var(--tint), transparent); } .banner-warn .i { color: var(--color-degraded); }
.banner-bad { background: color-mix(in srgb, var(--color-unavailable) var(--tint), transparent); } .banner-bad .i { color: var(--color-unavailable); }
.banner-ok { background: color-mix(in srgb, var(--color-operational) var(--tint), transparent); } .banner-ok .i { color: var(--color-operational); }
.banner-info { background: color-mix(in srgb, var(--color-muted) var(--tint), transparent); } .banner-info .i { color: var(--color-muted); }
.banner .act { grid-column: 2; display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-1); }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--color-border); border-top-color: var(--color-accent); display: inline-block; vertical-align: middle; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }
.footnote { font-size: var(--text-xs); color: var(--color-muted); text-align: center; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--color-text); color: var(--color-bg); padding: 10px 14px; border-radius: var(--radius-md); font-size: var(--text-sm); opacity: 0; pointer-events: none; transition: opacity var(--motion-normal); max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }

@media (max-width: 359px) { .status-card .acts { grid-template-columns: 1fr; } .btn { padding: 0 var(--space-3); } }

</style>

  const track = (name, props) => { events.push({ name, at: Date.now(), props: props || {} }); const c = document.getElementById('sc-events'); if (c) c.textContent = String(events.length); };
  const t = (k, p) => { let s = I18N[S.lang][k]; if (s === undefined) s = I18N.ru[k] !== undefined ? I18N.ru[k] : k; if (p) Object.keys(p).forEach(x => { s = s.split('{' + x + '}').join(String(p[x])); }); return s; };
  const L = o => (o && typeof o === 'object') ? (o[S.lang] || o.ru) : o;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ico = (n, cls) => '<svg class="i ' + (cls || '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
  const $ = s => document.querySelector(s);
  const content = $('#content'), bar = $('#appbar');
  const STEPS = ['bind', 'exclude', 'cellular', 'done'];
  const ONB = { unbound: 'bind', bind_error: 'bind', exclude: 'exclude', cellular_checking: 'cellular', cellular_ok: 'cellular', cellular_fail: 'cellular', cellular_nosim: 'cellular', done: 'done' };
  const servers = FX.servers.map(s => ({ id: s.id, flag: s.flag, name: s.name }));

  function applyTheme() { const h = document.documentElement; if (S.theme === 'auto') h.removeAttribute('data-theme'); else h.setAttribute('data-theme', S.theme); h.style.fontSize = S.text200 ? '200%' : ''; h.lang = S.lang; }
  function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2000); }
  function stepper(cur) { const idx = STEPS.indexOf(cur); return '<div class="stepper" aria-label="' + esc(STEPS.map(s => t('android.step.' + s)).join(' → ')) + '">' + STEPS.map((s, i) => '<div data-on="' + (i === idx) + '" data-done="' + (i < idx) + '"><i></i><span>' + esc(t('android.step.' + s)) + '</span></div>').join('') + '</div>'; }
  function renderBar(onb) {
    bar.innerHTML = '<button type="button" class="icon-btn ' + (onb && onb !== 'bind' ? '' : 'hidden') + '" id="back" aria-label="' + esc(t('action.back')) + '">' + ico('back') + '</button><div class="ttl">' + esc(t('android.title')) + '<small>' + esc(t('android.subtitle')) + '</small></div><button type="button" class="lang-btn" id="lang" aria-label="' + esc(t('app.lang.switch', { language: S.lang === 'ru' ? 'English' : 'русский' })) + '">' + esc(t('app.lang.other')) + '</button>';
    $('#lang').addEventListener('click', () => { S.lang = S.lang === 'ru' ? 'en' : 'ru'; render(); });
    const b = $('#back'); if (b) b.addEventListener('click', () => { const prev = { exclude: 'unbound', cellular: 'exclude', done: 'cellular_ok' }[onb]; if (prev) set(prev); });
  }
  function set(state) { S.state = state; render(); const sel = document.getElementById('sc-state'); if (sel) sel.value = state; }

  function onboarding(step) {
    let body = '';
    if (step === 'bind') {
      body = '<h1>' + esc(t('android.bind.title')) + '</h1><p class="muted">' + esc(t('android.bind.body')) + '</p><div class="field"><label for="code">' + esc(t('android.bind.code')) + '</label><input id="code" inputmode="text" autocomplete="one-time-code" placeholder="XXXX-XXXX" value="' + esc(S.code) + '" aria-invalid="' + (S.state === 'bind_error') + '" ' + (S.state === 'bind_error' ? 'aria-describedby="code-err"' : '') + '>' + (S.state === 'bind_error' ? '<div class="err" id="code-err" role="alert">' + esc(t('android.bind.error')) + '</div>' : '') + '</div><button type="button" class="btn btn-primary btn-block" id="bind">' + esc(t('android.bind.action')) + '</button>';
    } else if (step === 'exclude') {
      body = '<h1>' + esc(t('android.exclude')) + '</h1><p>' + esc(t('android.exclude.body')) + '</p><p class="muted small">' + esc(t('android.exclude.why')) + '</p><button type="button" class="btn btn-primary btn-block" id="excluded">' + ico('check') + esc(t('android.exclude.confirm')) + '</button>';
    } else if (step === 'cellular') {
      const st = S.state;
      const box = st === 'cellular_checking' ? '<div class="banner banner-info" aria-live="polite"><span class="spin" aria-hidden="true"></span><div>' + esc(t('android.cellular.checking')) + '</div></div>'
        : st === 'cellular_ok' ? '<div class="banner banner-ok" role="status">' + ico('check') + '<div>' + esc(t('android.cellular.ok')) + '</div></div>'
        : st === 'cellular_nosim' ? '<div class="banner banner-bad" role="alert">' + ico('signal') + '<div>' + esc(t('android.cellular.noSim')) + '<br><span class="muted">' + esc(t('android.cellular.fix')) + '</span></div><div class="act"><button type="button" class="btn btn-tonal" id="retry">' + esc(t('android.cellular.retry')) + '</button></div></div>'
        : '<div class="banner banner-bad" role="alert">' + ico('x') + '<div>' + esc(t('android.cellular.fail')) + '<br><span class="muted">' + esc(t('android.cellular.fix')) + '</span></div><div class="act"><button type="button" class="btn btn-tonal" id="retry">' + esc(t('android.cellular.retry')) + '</button><button type="button" class="btn btn-outline" id="settings">' + ico('settings') + esc(t('android.permission.action')) + '</button></div></div>';
      body = '<h1>' + esc(t('android.step.cellular')) + '</h1><p class="muted">' + esc(t('android.cellularReady')) + '</p>' + box + '<div class="kv"><div><span class="k">' + esc(t('android.network')) + '</span><span class="v">' + (st === 'cellular_nosim' ? '—' : 'LTE') + '</span></div><div><span class="k">' + esc(t('android.wifiOn')) + '</span><span class="v ok">' + ico('check') + '</span></div></div>' + (st === 'cellular_ok' ? '<button type="button" class="btn btn-primary btn-block" id="next">' + esc(t('android.step.done')) + '</button>' : '');
    } else {
      body = '<h1>' + esc(t('android.step.done')) + '</h1><p>' + esc(t('android.done.body')) + '</p><div class="banner banner-info">' + ico('pc') + '<div>' + esc(t('android.pcChecksVpn')) + '</div></div><button type="button" class="btn btn-primary btn-block" id="start">' + ico('play') + esc(t('android.start')) + '</button>';
    }
    return stepper(step) + body;
  }
  function main() {
    const st = S.state, running = st === 'running' || st === 'queued';
    const results = servers.map((s, i) => { const r = st === 'stale' ? 'unknown' : (st === 'queued' && i === 1) ? 'fail' : 'ok'; const cls = { ok: 'ok', fail: 'bad', unknown: 'unk' }[r]; return '<div><span class="k">' + s.flag + ' ' + esc(L(s.name)) + '</span><span class="v ' + cls + '">' + { ok: ico('check'), fail: ico('x'), unknown: '—' }[r] + esc(t('android.result.' + r)) + (st === 'stale' ? '' : ' · 14:3' + (i + 1)) + '</span></div>'; }).join('');
    const banner = st === 'queued' ? '<div class="banner banner-warn" role="status">' + ico('offline') + '<div>' + esc(t('android.offline')) + '<br><span class="muted">' + esc(t('android.queued', { n: 3 })) + '</span></div></div>'
      : st === 'stale' ? '<div class="banner banner-warn" role="status">' + ico('clock') + '<div>' + esc(t('android.stale')) + '</div></div>'
      : st === 'permission' ? '<div class="banner banner-bad" role="alert">' + ico('lock') + '<div>' + esc(t('android.permission')) + '</div><div class="act"><button type="button" class="btn btn-tonal" id="settings">' + ico('settings') + esc(t('android.permission.action')) + '</button></div></div>' : '';
    return banner +
      '<div class="card status-card"><div class="big">' + (running ? ico('pulse') : ico('stop')) + '<span>' + esc(t(running ? 'android.main.running' : 'android.main.stopped')) + '</span></div><p class="muted small">' + esc(t(running ? 'android.main.everyMinute' : 'android.main.background')) + '</p><div class="acts"><button type="button" class="btn btn-primary" id="start" ' + (running || st === 'permission' ? 'disabled' : '') + '>' + ico('play') + esc(t('android.start')) + '</button><button type="button" class="btn btn-outline" id="stop" ' + (running ? '' : 'disabled') + '>' + ico('stop') + esc(t('android.stop')) + '</button></div></div>' +
      '<div class="card"><div class="kv"><div><span class="k">' + esc(t('android.network')) + '</span><span class="v">' + ico('signal') + (st === 'permission' ? '—' : 'LTE') + '</span></div><div><span class="k">' + esc(t('android.route')) + '<small>' + esc(t('android.cellularReady')) + '</small></span><span class="v ' + (st === 'permission' ? 'unk' : 'ok') + '">' + (st === 'permission' ? '—' : ico('check') + esc(t('android.route.ok'))) + '</span></div><div><span class="k">' + esc(t('android.lastCheck')) + '</span><span class="v">' + (st === 'stale' ? '3 ' + esc(t('duration.hour', { n: 3 }).replace(/^3\s*/, '')) : st === 'stopped' ? '14:33' : '14:33') + '</span></div><div><span class="k">' + esc(t('android.queue')) + '</span><span class="v">' + (st === 'queued' ? 3 : 0) + '</span></div></div></div>' +
      '<div class="card"><h2 style="font-size:1rem">' + esc(t('android.results')) + '</h2><div class="kv">' + results + '</div><p class="footnote">' + esc(t('android.pcChecksVpn')) + '</p></div>' +
      '<div class="card"><div class="kv"><div><span class="k">' + esc(t('android.sent')) + '</span><span class="v">' + (st === 'queued' ? esc(t('android.queued', { n: 3 })) : '14:33') + '</span></div><div><span class="k">' + esc(t('android.bound')) + '</span><span class="v ok">' + ico('check') + '</span></div></div><button type="button" class="btn btn-outline btn-danger btn-block" id="unbind">' + esc(t('android.unbind')) + '</button></div>';
  }
  function render() {
    applyTheme();
    const onb = ONB[S.state];
    renderBar(onb);
    content.innerHTML = onb ? onboarding(onb) : main();
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
    const code = $('#code'); if (code) code.addEventListener('input', () => { S.code = code.value; });
    on('bind', () => { track('android_onboarding_step', { step: 'bind', result: S.code.trim().length >= 8 ? 'ok' : 'error' }); set(S.code.trim().length >= 8 ? 'exclude' : 'bind_error'); if (S.state === 'bind_error') { const c = $('#code'); if (c) c.focus(); } });
    on('excluded', () => { track('android_onboarding_step', { step: 'exclude', result: 'confirmed' }); set('cellular_checking'); setTimeout(() => { if (S.state === 'cellular_checking') { track('android_route_check', { result: 'ok', ip_family: 'v4' }); set('cellular_ok'); } }, 1200); });
    on('retry', () => { set('cellular_checking'); setTimeout(() => { if (S.state === 'cellular_checking') { track('android_route_check', { result: 'ok', ip_family: 'v4' }); set('cellular_ok'); } }, 1200); });
    on('next', () => set('done'));
    on('start', () => { track('android_probe_started', { network_type: 'cellular', vpn_excluded_confirmed: true }); set('running'); });
    on('stop', () => { track('android_probe_stopped', { reason: 'user', duration_bucket: 'short' }); set('stopped'); });
    on('settings', () => toast(t('admin.demoAction')));
    on('unbind', () => { toast(t('admin.demoAction')); });
    try { document.dispatchEvent(new CustomEvent('vpnpulse:render', { detail: { lang: S.lang, state: S.state } })); } catch (e) { /* */ }
  }
  window.VPNPulseShowcase = { apply(o) { if (o.state) S.state = o.state; if (o.lang) S.lang = o.lang; if (o.theme) S.theme = o.theme; if (o.text200 !== undefined) S.text200 = o.text200; if (o.showcase) document.body.setAttribute('data-showcase', o.showcase); render(); }, state: () => ({ state: S.state, lang: S.lang }), events };
  const sel = document.getElementById('sc-state');
  if (sel) { ['unbound', 'bind_error', 'exclude', 'cellular_checking', 'cellular_ok', 'cellular_fail', 'cellular_nosim', 'done', 'running', 'stopped', 'queued', 'stale', 'permission'].forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); }); sel.value = S.state; sel.addEventListener('change', () => set(sel.value)); }
  document.querySelectorAll('[data-sc-theme]').forEach(b => b.addEventListener('click', () => { S.theme = b.getAttribute('data-sc-theme'); document.querySelectorAll('[data-sc-theme]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); }));
  const tx = document.getElementById('sc-text'); if (tx) tx.addEventListener('click', () => { S.text200 = !S.text200; tx.setAttribute('aria-pressed', String(S.text200)); render(); });
  const hide = document.getElementById('sc-hide'); if (hide) hide.addEventListener('click', () => document.body.setAttribute('data-showcase', 'hidden'));
  render();
})();

</script>

</body>
</html>

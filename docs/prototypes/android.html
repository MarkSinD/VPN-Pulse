<style>
/* VPN Pulse — shared UI tokens (Mini App, onboarding showcase, Android web mock).
   v5 "instrument panel": near-black glass in the dark theme, iOS-clean grouped background in the
   light theme, lamp colours for states, engraved hairlines, gauge rings with flags.
   The palette is the product's own; Telegram only decides light vs dark (colorScheme) and receives
   the background via setHeaderColor. Type scale uses rem so system text scaling (200%) is respected.
   Every colour pair used for text is >= 4.5:1, control boundaries >= 3:1 (scripts/check_contrast.py).

   Surfaces: --color-bg (page) < --color-surface (cards) < --color-raised (selected / lifted);
   --color-well is the recessed track under segmented controls, code and text fields. */
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-xs: 0.75rem;   /* 12 */
  --text-sm: 0.875rem;  /* 14 */
  --text-md: 1rem;      /* 16 */
  --text-lg: 1.25rem;   /* 20 */
  --text-xl: 1.5rem;    /* 24 */
  --lh-tight: 1.2;
  --lh-caption: 1.4;
  --lh-normal: 1.5;
  --control-min: 44px;
  --row-min: 72px;
  --accordion-min: 48px;
  --ring-size: 64px;
  --ring-size-sm: 48px;
  --focus-width: 2px;
  --motion-fast: 140ms;
  --motion-normal: 180ms;
  --content-max: 560px;
  --content-wide: 960px;

  /* light — clean grouped background, white cards, graphite controls */
  --color-bg: #f2f2f7;
  --color-surface: #ffffff;
  --color-raised: #ffffff;
  --color-well: #e5e5ea;
  --color-text: #1c1c1e;
  --color-muted: #66666d;
  --color-accent: #2c2c2e;
  --color-accent-text: #f5f5f7;
  --color-border: rgba(60, 60, 67, 0.14);
  --color-border-strong: rgba(60, 60, 67, 0.6);
  --line-dark: rgba(60, 60, 67, 0.16);
  --line-light: rgba(255, 255, 255, 0.7);
  --color-operational: #14713d;
  --color-degraded: #8a5200;
  --color-unavailable: #b3261e;
  --color-unknown: #5f6670;
  --color-admin: #5b3fc4;
  --tint: 12%;
  --color-focus: var(--color-accent);
  --metal: linear-gradient(180deg, #4d535a 0%, #2f353b 55%, #23282d 100%);
  --metal-pressed: linear-gradient(180deg, #23282d 0%, #2f353b 100%);
  --metal-edge: inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 -1px 0 rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.25);
  --card-edge: 0 0 0 1px rgba(60, 60, 67, 0.08);
  --panel-inset: inset 0 1px 2px rgba(60, 60, 67, 0.12);
  --lamp-glow: 0 0 0 1px rgba(60, 60, 67, 0.08);
  --shadow-float: 0 8px 24px rgba(28, 28, 30, 0.18);
}

@media (prefers-color-scheme: dark) {

    --color-bg: #0b0c0e;

    --color-muted: #9a9aa1;
    --color-accent: #dcdce1;
    --color-accent-text: #0b0c0e;
    --color-border: rgba(255, 255, 255, 0.1);
    --color-border-strong: rgba(255, 255, 255, 0.38);
    --line-dark: rgba(0, 0, 0, 0.6);
    --line-light: rgba(255, 255, 255, 0.08);
    --color-operational: #30d158;
    --color-degraded: #ff9f0a;
    --color-unavailable: #ff453a;
    --color-unknown: #a1a1a8;
    --color-admin: #bf9fff;
    --tint: 16%;
    --metal: linear-gradient(180deg, #eeece8 0%, #d2d3d3 55%, #bfc1c3 100%);
    --metal-pressed: linear-gradient(180deg, #bfc1c3 0%, #d2d3d3 100%);
    --metal-edge: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -1px 0 rgba(0, 0, 0, 0.28), 0 1px 2px rgba(0, 0, 0, 0.55);
    --card-edge: 0 0 0 1px rgba(255, 255, 255, 0.05);
    --panel-inset: inset 0 1px 2px rgba(0, 0, 0, 0.6);
    --lamp-glow: 0 0 6px color-mix(in srgb, currentColor 55%, transparent);
    --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.6);
  }
}

:root[data-theme="dark"] {
  --color-bg: #0b0c0e;
  --color-surface: #1c1c1e;
  --color-raised: #2c2c2e;
  --color-well: #131315;
  --color-text: #f5f5f7;
  --color-muted: #9a9aa1;
  --color-accent: #dcdce1;
  --color-accent-text: #0b0c0e;
  --color-border: rgba(255, 255, 255, 0.1);
  --color-border-strong: rgba(255, 255, 255, 0.38);
  --line-dark: rgba(0, 0, 0, 0.6);
  --line-light: rgba(255, 255, 255, 0.08);
  --color-operational: #30d158;
  --color-degraded: #ff9f0a;
  --color-unavailable: #ff453a;
  --color-unknown: #a1a1a8;
  --color-admin: #bf9fff;
  --tint: 16%;
  --metal: linear-gradient(180deg, #eeece8 0%, #d2d3d3 55%, #bfc1c3 100%);
  --metal-pressed: linear-gradient(180deg, #bfc1c3 0%, #d2d3d3 100%);
  --metal-edge: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -1px 0 rgba(0, 0, 0, 0.28), 0 1px 2px rgba(0, 0, 0, 0.55);
  --card-edge: 0 0 0 1px rgba(255, 255, 255, 0.05);
  --panel-inset: inset 0 1px 2px rgba(0, 0, 0, 0.6);
  --lamp-glow: 0 0 6px color-mix(in srgb, currentColor 55%, transparent);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.6);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-fast: 1ms;
    --motion-normal: 1ms;
  }
}

/* VPN Pulse Probe — Android mock (web prototype of the native flow).
   Composition follows the VPN client people already use: one calm screen, a glowing state ring
   in the middle that is also the main control, a quiet line under it, details in a sheet at the
   bottom, two tabs. Everything else — palette, type, radii, lamps, metal, engraved hairlines —
   is the Mini App's v5 instrument panel, token for token. */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: var(--text-md); line-height: var(--lh-normal); overflow: hidden; display: flex; flex-direction: column; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: .5; }
:focus { outline: none; }
:focus-visible { outline: var(--focus-width) solid var(--color-focus); outline-offset: 2px; border-radius: var(--radius-sm); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.28em; }

.showcase { flex: none; background: #1f2430; color: #e6e9ef; font-size: 13px; padding: 8px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-bottom: 3px dashed #4b5568; font-family: var(--font-mono); }
.showcase .sc-label { font-weight: 700; text-transform: uppercase; font-size: 11px; color: #9aa4b5; letter-spacing: .04em; }
.showcase select, .showcase .sc-btn { background: #2b3242; color: #e6e9ef; border: 1px solid #4b5568; border-radius: 6px; padding: 4px 8px; min-height: 32px; font: inherit; }
.showcase .sc-btn[aria-pressed="true"] { background: #4b7bec; border-color: #4b7bec; color: #fff; }
body[data-showcase="hidden"] .showcase { display: none; }

/* ---------- shell: bar, stage, tabs ---------- */
.device { flex: 1; min-height: 0; width: 100%; max-width: 480px; margin: 0 auto; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; background: var(--color-bg); }
.appbar { display: grid; grid-template-columns: var(--control-min) minmax(0, 1fr) auto; align-items: center; gap: var(--space-2); padding: calc(var(--space-1) + env(safe-area-inset-top, 0px)) var(--space-3) var(--space-1); min-height: 56px; background: var(--color-bg); position: relative; z-index: 1; }
.appbar .ttl { font-weight: 700; font-size: var(--text-md); min-width: 0; text-align: center; }
.appbar .ttl small { display: block; font-weight: 400; font-size: var(--text-xs); color: var(--color-muted); }
.icon-btn { width: var(--control-min); height: var(--control-min); display: inline-grid; place-items: center; border-radius: 50%; color: var(--color-text); }
.icon-btn .i { width: 22px; height: 22px; }
.icon-btn.hidden { visibility: hidden; }
.lang-btn { min-width: var(--control-min); height: var(--control-min); padding: 0 var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 700; letter-spacing: .06em; color: var(--color-text); border: 1px solid var(--color-border-strong); box-shadow: inset 0 1px 0 var(--line-light); }
.content { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; -ms-overflow-style: none; padding: var(--space-3) var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
.content::-webkit-scrollbar { width: 0; height: 0; }
.content.stage { gap: var(--space-5); }
.content > .dock { margin-top: auto; }
/* the block floats in the middle of what is left, the button stays at the bottom edge: two auto
   margins on the pane split the free space evenly, so nothing hangs in a half-screen gap */
.content.stage > .pane { margin-top: auto; margin-bottom: auto; }
.content.stage > .dock { margin-top: 0; }
.pane { display: grid; gap: var(--space-5); align-content: start; }
.stepbar { padding: 0 var(--space-4) var(--space-2); background: var(--color-bg); }

.tabbar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-top: 1px solid var(--line-dark); box-shadow: 0 -1px 0 var(--line-light); background: var(--color-bg); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar button { min-height: 56px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: var(--text-xs); color: var(--color-muted); }
.tabbar button .i { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--color-text); font-weight: 700; }
.tabbar.hidden { display: none; }

/* ---------- the ring: state and main control ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: var(--space-4); padding-top: var(--space-4); }  /* minmax(0,1fr): without it the track grows to the chip's max-content and max-width:100% clamps to nothing */
.ring { --ring: var(--color-unknown); width: min(248px, 64vw); aspect-ratio: 1; border-radius: 50%; display: grid; place-content: center; justify-items: center; gap: var(--space-1); text-align: center; padding: var(--space-5); color: var(--ring);
  border: 3px solid currentColor; box-shadow: 0 0 26px color-mix(in srgb, currentColor 42%, transparent), inset 0 0 36px color-mix(in srgb, currentColor 10%, transparent); transition: color var(--motion-normal), box-shadow var(--motion-normal), transform var(--motion-fast); }
.ring:active { transform: scale(.985); }
.ring .st { font-size: var(--text-lg); font-weight: 700; line-height: var(--lh-tight); color: currentColor; }
.ring .sub { font-size: var(--text-xs); line-height: var(--lh-caption); color: var(--color-muted); max-width: 18ch; }
.ring[data-state="operational"] { --ring: var(--color-operational); }
.ring[data-state="degraded"] { --ring: var(--color-degraded); }
.ring[data-state="unavailable"] { --ring: var(--color-unavailable); }
.ring[data-state="unknown"] { --ring: var(--color-unknown); }
.ring[data-busy="true"] { border-style: dashed; }
@media (prefers-reduced-motion: no-preference) {
  .ring[data-live="true"] { animation: breathe 2.6s ease-in-out infinite; }
  .ring[data-busy="true"] { animation: rotate 2.4s linear infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 38px color-mix(in srgb, currentColor 58%, transparent), inset 0 0 44px color-mix(in srgb, currentColor 14%, transparent); } }
  @keyframes rotate { to { transform: rotate(360deg); } }
}
.hero .hint { font-size: var(--text-sm); color: var(--color-muted); }

/* ---------- the quiet line under the ring (route), like the client's own ---------- */
.chip { min-height: var(--control-min); display: inline-flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4); border-radius: 999px; background: var(--color-surface); box-shadow: var(--card-edge), var(--panel-inset); font-size: var(--text-sm); color: var(--color-text); max-width: 100%; }
.chip .i { width: 18px; height: 18px; }
.chip .lamp { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: var(--lamp-glow); flex: none; }
.chip.ok { color: var(--color-operational); } .chip.bad { color: var(--color-unavailable); } .chip.unk { color: var(--color-unknown); }
.chip .txt { color: var(--color-text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip[aria-expanded] .i.chev { transition: transform var(--motion-fast); }
.chip[aria-expanded="true"] .i.chev { transform: rotate(180deg); }

/* ---------- the sheet at the bottom: what was measured ---------- */
.sheet { background: var(--color-surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--card-edge), 0 -1px 0 var(--line-light); padding: var(--space-3) var(--space-4) var(--space-4); display: grid; gap: var(--space-3); margin: auto calc(var(--space-4) * -1) calc(var(--space-4) * -1); }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--color-border-strong); opacity: .5; justify-self: center; }
.sheet h2 { font-size: var(--text-md); margin: 0; font-weight: 700; display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
.sheet h2 time { font-size: var(--text-sm); font-weight: 400; color: var(--color-muted); font-variant-numeric: tabular-nums; }
.card { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-4); display: grid; gap: var(--space-3); box-shadow: var(--card-edge), var(--panel-inset); }

.rows { display: grid; }
.rows > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; padding: var(--space-2) 0; border-top: 1px solid var(--color-border); min-height: var(--accordion-min); }
.rows > div:first-child { border-top: 0; }
.rows .k { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.rows .k small { display: block; color: var(--color-muted); font-size: var(--text-xs); }
.rows .v { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--color-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rows .v .lamp { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: var(--lamp-glow); flex: none; }
.rows .v.ok { color: var(--color-operational); font-weight: 700; }
.rows .v.bad { color: var(--color-unavailable); font-weight: 700; }
.rows .v.unk { color: var(--color-unknown); font-weight: 700; }
.flag { width: 22px; height: 16px; border-radius: 3px; box-shadow: 0 0 0 1px var(--color-border); flex: none; object-fit: cover; }

/* ---------- onboarding ---------- */
.stepper { display: grid; gap: 6px; }
.stepper .bars, .stepper .names { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-1); }
.stepper i { height: 4px; border-radius: 2px; background: var(--color-border); display: block; }
.stepper i[data-done="true"] { background: var(--color-accent); }
.stepper .names span, .stepper .now { font-size: var(--text-xs); line-height: var(--lh-caption); color: var(--color-muted); text-align: center; }
.stepper .names span[data-on="true"], .stepper .now { color: var(--color-text); font-weight: 700; }
.stepper .now { display: none; }
/* 200 %: a quarter of the width cannot hold "Исключение", and a word broken in half is worse than
   three unnamed bars — so only the step in hand is named, across the whole bar */
html[data-text200="true"] .stepper .names { display: none; }
html[data-text200="true"] .stepper .now { display: block; }
h1 { font-size: var(--text-xl); line-height: var(--lh-tight); margin: 0; font-weight: 700; }
h2 { font-size: var(--text-lg); margin: 0; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--color-muted); }
.small { font-size: var(--text-sm); }
.step-body { display: grid; gap: var(--space-3); }
/* one alignment per screen: a scene is centred on its ring, a form is flush left */
.step-body.centred { justify-items: center; text-align: center; }
.steps-list { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--space-2); counter-reset: step; }
.steps-list li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-3); align-items: center; counter-increment: step; }
.steps-list li::before { content: counter(step); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: var(--text-xs); font-weight: 700; color: var(--color-accent-text); background: var(--color-accent); }
.field { display: grid; gap: 6px; }
.field label { font-size: var(--text-sm); color: var(--color-muted); }
.field input { min-height: 48px; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 0 var(--space-3); background: var(--color-well); box-shadow: var(--panel-inset); font-family: var(--font-mono); font-size: 18px; letter-spacing: .08em; width: 100%; }
.field input[aria-invalid="true"] { border-color: var(--color-unavailable); }
.field .err { font-size: var(--text-sm); color: var(--color-unavailable); }
.dock { display: grid; gap: var(--space-2); }

.btn { min-width: 0; min-height: 48px; padding: 0 var(--space-4); border-radius: 24px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); border: 1px solid transparent; transition: transform var(--motion-fast); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--metal); color: var(--color-accent-text); box-shadow: var(--metal-edge); }
.btn-primary:active { background: var(--metal-pressed); box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.35); }
.btn-tonal { background: color-mix(in srgb, var(--color-accent) 14%, transparent); color: var(--color-accent); }
.btn-outline { border-color: var(--color-border-strong); }
.btn-danger { color: var(--color-unavailable); border-color: color-mix(in srgb, var(--color-unavailable) 40%, transparent); }
.btn-block { width: 100%; }

/* ---------- notices ---------- */
.banner { border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: grid; grid-template-columns: auto 1fr; gap: var(--space-3); font-size: var(--text-sm); align-items: start; }
.banner .i { width: 20px; height: 20px; margin-top: 1px; }
.banner-warn { background: color-mix(in srgb, var(--color-degraded) var(--tint), transparent); } .banner-warn .i { color: var(--color-degraded); }
.banner-bad { background: color-mix(in srgb, var(--color-unavailable) var(--tint), transparent); } .banner-bad .i { color: var(--color-unavailable); }
.banner-ok { background: color-mix(in srgb, var(--color-operational) var(--tint), transparent); } .banner-ok .i { color: var(--color-operational); }
.banner-info { background: color-mix(in srgb, var(--color-muted) var(--tint), transparent); } .banner-info .i { color: var(--color-muted); }
.banner .act { grid-column: 2; display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-1); }
.footnote { font-size: var(--text-xs); color: var(--color-muted); text-align: center; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--color-text); color: var(--color-bg); padding: 10px 14px; border-radius: var(--radius-md); font-size: var(--text-sm); opacity: 0; pointer-events: none; transition: opacity var(--motion-normal); max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }

@media (max-width: 359px) { .ring { width: min(248px, 58vw); padding: var(--space-4); } .btn { padding: 0 var(--space-3); } }

</style>

<script>
/* VPN Pulse Probe — Android flow mock. States are showcase fixtures; nothing is sent anywhere.
   The screen is built the way a VPN client is: the ring in the middle says what is happening and
   starts or stops the checks; the line under it is the route; the sheet at the bottom is what was
   measured. Palette, type and lamps come from the Mini App's tokens. */
(function () {
  'use strict';
  const I18N = window.__I18N, FX = window.__FIXTURES, q = new URLSearchParams(location.search);
  const S = { state: q.get('state') || 'unbound', lang: (q.get('lang') || 'ru'), theme: q.get('theme') || 'auto', text200: q.get('text') === '200', code: '', tab: q.get('tab') || 'check', details: false };
  if (!I18N[S.lang]) S.lang = 'ru';
  if (q.get('showcase') === 'hidden') document.body.setAttribute('data-showcase', 'hidden');
  const events = window.__vpnPulseEvents = [];
  const track = (name, props) => { events.push({ name, at: Date.now(), props: props || {} }); const c = document.getElementById('sc-events'); if (c) c.textContent = String(events.length); };
  const t = (k, p) => { let s = I18N[S.lang][k]; if (s === undefined) s = I18N.ru[k] !== undefined ? I18N.ru[k] : k; if (p) Object.keys(p).forEach(x => { s = s.split('{' + x + '}').join(String(p[x])); }); return s; };
  const L = o => (o && typeof o === 'object') ? (o[S.lang] || o.ru) : o;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ico = (n, cls) => '<svg class="i ' + (cls || '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
  const $ = s => document.querySelector(s);
  const content = $('#content'), bar = $('#appbar'), tabs = $('#tabbar'), steps = $('#steps');
  const STEPS = ['bind', 'exclude', 'cellular', 'done'];
  const ONB = { unbound: 'bind', bind_error: 'bind', exclude: 'exclude', cellular_checking: 'cellular', cellular_ok: 'cellular', cellular_fail: 'cellular', cellular_nosim: 'cellular', done: 'done' };
  const servers = FX.servers.map(s => ({ id: s.id, flag: s.flag, name: s.name }));
  // one place decides how a state looks: ring colour, whether it breathes, the words inside
  // A circle is a bad place for prose: the word of the state, and at most one short line under it.
  // Anything longer belongs to the quiet line below the ring — ONB_HINT on the onboarding steps.
  const RING = {
    running: { state: 'operational', live: true, title: 'android.main.running', sub: 'android.main.everyMinute', hint: 'android.ring.stop' },
    queued: { state: 'degraded', live: true, title: 'android.main.running', sub: 'android.main.everyMinute', hint: 'android.ring.stop' },
    stopped: { state: 'unknown', live: false, title: 'android.main.stopped', sub: null, hint: 'android.ring.start' },
    stale: { state: 'degraded', live: false, title: 'android.stale', sub: null, hint: 'android.ring.start' },
    permission: { state: 'unavailable', live: false, title: 'android.ring.noAccess', sub: null, hint: null },
    cellular_checking: { state: 'unknown', busy: true, title: 'android.cellular.checking', sub: null, hint: null },
    cellular_ok: { state: 'operational', live: false, title: 'android.route.ok', sub: null, hint: null },
    cellular_fail: { state: 'unavailable', live: false, title: 'android.route.bad', sub: null, hint: null },
    cellular_nosim: { state: 'unknown', live: false, title: 'android.cellular.noSim', sub: null, hint: null }
  };
  const ONB_HINT = {
    cellular_checking: 'android.cellularReady',
    cellular_ok: 'android.cellular.ok',
    cellular_fail: 'android.cellular.fail',
    cellular_nosim: 'android.cellular.fix'
  };

  function applyTheme() { const h = document.documentElement; if (S.theme === 'auto') h.removeAttribute('data-theme'); else h.setAttribute('data-theme', S.theme); h.style.fontSize = S.text200 ? '200%' : ''; if (S.text200) h.setAttribute('data-text200', 'true'); else h.removeAttribute('data-text200'); h.lang = S.lang; }
  function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2000); }
  function set(state) { S.state = state; render(); const sel = document.getElementById('sc-state'); if (sel) sel.value = state; }
  // bars, names under them, and — at 200 % text, where four names cannot share the width without
  // breaking words in half — the name of the step in hand alone, across the whole bar
  function stepper(cur) {
    const idx = STEPS.indexOf(cur);
    const label = s => esc(t('android.step.' + s));
    return '<div class="stepper" aria-label="' + esc(STEPS.map(s => t('android.step.' + s)).join(' → ')) + '">'
      + '<div class="bars">' + STEPS.map((s, i) => '<i data-done="' + (i <= idx) + '"></i>').join('') + '</div>'
      + '<div class="names">' + STEPS.map((s, i) => '<span data-on="' + (i === idx) + '">' + label(s) + '</span>').join('') + '</div>'
      + '<div class="now">' + label(STEPS[idx]) + '</div></div>';
  }

  function renderBar(onb) {
    bar.innerHTML = '<button type="button" class="icon-btn ' + (onb && onb !== 'bind' ? '' : 'hidden') + '" id="back" aria-label="' + esc(t('action.back')) + '">' + ico('back') + '</button>'
      + '<div class="ttl">' + esc(t('android.title')) + '<small>' + esc(t('android.subtitle')) + '</small></div>'
      + '<button type="button" class="lang-btn" id="lang" aria-label="' + esc(t('app.lang.switch', { language: S.lang === 'ru' ? 'English' : 'русский' })) + '">' + esc(t('app.lang.other')) + '</button>';
    $('#lang').addEventListener('click', () => { S.lang = S.lang === 'ru' ? 'en' : 'ru'; render(); });
    const b = $('#back'); if (b) b.addEventListener('click', () => { const prev = { exclude: 'unbound', cellular: 'exclude', done: 'cellular_ok' }[onb]; if (prev) set(prev); });

  // the ring: state, and on the main screen the control itself
  function ring(key, clickable) {
    const r = RING[key]; if (!r) return '';
    const inner = '<span class="st">' + esc(t(r.title)) + '</span>' + (r.sub ? '<span class="sub">' + esc(t(r.sub)) + '</span>' : '');
    const attrs = 'class="ring" data-state="' + r.state + '"' + (r.live ? ' data-live="true"' : '') + (r.busy ? ' data-busy="true"' : '');
    if (!clickable) return '<div ' + attrs + ' role="img" aria-label="' + esc(t(r.title)) + '">' + inner + '</div>';
    return '<button type="button" ' + attrs + ' id="ring" aria-label="' + esc(t(r.title) + (r.hint ? '. ' + t(r.hint) : '')) + '">' + inner + '</button>';
  }

  function onboarding(step) {
    if (step === 'cellular') {
      const st = S.state;
      const act = st === 'cellular_ok'
        ? '<button type="button" class="btn btn-primary btn-block" id="next">' + esc(t('android.step.done')) + '</button>'
        : st === 'cellular_checking' ? ''
          : '<button type="button" class="btn btn-primary btn-block" id="retry">' + ico('refresh') + esc(t('android.cellular.retry')) + '</button>'
          + (st === 'cellular_fail' ? '<button type="button" class="btn btn-outline btn-block" id="settings">' + ico('settings') + esc(t('android.permission.action')) + '</button>' : '');
      return '<div class="pane"><div class="hero">' + ring(st, false)
        + '<p class="hint">' + esc(t(ONB_HINT[st])) + '</p></div></div>'
        + '<div class="dock">' + act + '</div>';
    }
    let body = '';
    if (step === 'bind') {
      body = '<div class="step-body"><h1>' + esc(t('android.bind.title')) + '</h1><p class="muted">' + esc(t('android.bind.body')) + '</p>'
        + '<div class="field"><label for="code">' + esc(t('android.bind.code')) + '</label><input id="code" inputmode="text" autocomplete="one-time-code" placeholder="XXXX-XXXX" value="' + esc(S.code) + '" aria-invalid="' + (S.state === 'bind_error') + '"' + (S.state === 'bind_error' ? ' aria-describedby="code-err"' : '') + '>'
        + (S.state === 'bind_error' ? '<div class="err" id="code-err" role="alert">' + esc(t('android.bind.error')) + '</div>' : '') + '</div></div>'
        + '<div class="dock"><button type="button" class="btn btn-primary btn-block" id="bind">' + esc(t('android.bind.action')) + '</button></div>';
    } else if (step === 'exclude') {
      // three actions, not a paragraph about three actions
      body = '<div class="step-body"><h1>' + esc(t('android.exclude')) + '</h1>'
        + '<ol class="steps-list">' + [1, 2, 3].map(n => '<li>' + esc(t('android.exclude.step' + n)) + '</li>').join('') + '</ol>'
        + '<p class="muted small">' + esc(t('android.exclude.why')) + '</p></div>'
        + '<div class="dock"><button type="button" class="btn btn-primary btn-block" id="excluded">' + ico('check') + esc(t('android.exclude.confirm')) + '</button></div>';
    } else {
      body = '<div class="hero">' + ring('cellular_ok', false) + '</div>'
        + '<div class="step-body centred"><h1>' + esc(t('android.step.done')) + '</h1><p class="muted">' + esc(t('android.done.body')) + '</p></div>'
        + '<div class="dock"><button type="button" class="btn btn-primary btn-block" id="start">' + ico('play') + esc(t('android.start')) + '</button></div>';
    }
    const dock = body.indexOf('<div class="dock">');
    return '<div class="pane">' + body.slice(0, dock) + '</div>' + body.slice(dock);
  }

  // ---------- main: ring, route line, sheet ----------
  function routeChip(st) {
    const bad = st === 'permission';
    const cls = bad ? 'bad' : 'ok';
    const text = t('android.route') + ': ' + t(bad ? 'android.route.bad' : 'android.route.ok');
    return '<button type="button" class="chip ' + cls + '" id="details" aria-expanded="' + S.details + '"><span class="lamp" aria-hidden="true"></span><span class="txt">' + esc(text) + '</span>' + ico('chevron-down', 'chev') + '</button>';
  }
  function notice(st) {
    if (st === 'queued') return '<div class="banner banner-warn" role="status">' + ico('offline') + '<div>' + esc(t('android.offline')) + '<br><span class="muted">' + esc(t('android.queued', { n: 3 })) + '</span></div></div>';
    if (st === 'permission') return '<div class="banner banner-bad" role="alert">' + ico('lock') + '<div>' + esc(t('android.permission')) + '</div><div class="act"><button type="button" class="btn btn-tonal" id="settings">' + ico('settings') + esc(t('android.permission.action')) + '</button></div></div>';
    return '';
  }
  function resultRows(st) {
    return servers.map((s, i) => {
      const r = st === 'stale' || st === 'permission' ? 'unknown' : (st === 'queued' && i === 1) ? 'fail' : 'ok';
      const cls = { ok: 'ok', fail: 'bad', unknown: 'unk' }[r];
      const when = (st === 'stale' || st === 'permission') ? '' : ' · 14:3' + (i + 1);
      return '<div><span class="k">' + s.flag + ' ' + esc(L(s.name)) + '</span><span class="v ' + cls + '"><span class="lamp" aria-hidden="true"></span>' + esc(t('android.result.' + r) + when) + '</span></div>';
    }).join('');
  }
  function detailRows(st) {
    const row = (k, v, cls) => '<div><span class="k">' + esc(k) + '</span><span class="v ' + (cls || '') + '">' + v + '</span></div>';
    return '<div class="rows">'
      + row(t('android.network'), ico('signal') + (st === 'permission' ? '—' : 'LTE'))
      + row(t('android.wifiOn'), ico('check'), 'ok')
      + row(t('android.lastCheck'), esc(st === 'stale' ? t('duration.hour', { n: 3 }) : '14:33'))
      + row(t('android.queue'), String(st === 'queued' ? 3 : 0), st === 'queued' ? 'bad' : '')
      + '</div>';
  }
  function checkTab() {
    const st = S.state;
    return notice(st)
      + '<div class="hero">' + ring(st, st !== 'permission') + routeChip(st) + '</div>'
      + (S.details ? '<div class="card">' + detailRows(st) + '</div>' : '')
      + '<div class="sheet"><div class="grab" aria-hidden="true"></div>'
      + '<h2>' + esc(t('android.results')) + '<time>' + esc(st === 'stale' ? t('android.stale') : t('android.lastCheck') + ' 14:33') + '</time></h2>'
      + '<div class="rows">' + resultRows(st) + '</div>'
      + '<p class="footnote">' + esc(t('android.pcChecksVpn')) + '</p></div>';
  }
  function settingsTab() {
    const st = S.state;
    return '<div class="card">' + detailRows(st) + '</div>'
      + '<div class="card"><div class="rows">'
      + '<div><span class="k">' + esc(t('android.sent')) + '</span><span class="v">' + esc(st === 'queued' ? t('android.queued', { n: 3 }) : '14:33') + '</span></div>'
      + '<div><span class="k">' + esc(t('android.bound')) + '</span><span class="v ok"><span class="lamp" aria-hidden="true"></span>' + ico('check') + '</span></div>'
      + '</div></div>'
      + '<div class="card"><p class="muted small">' + esc(t('android.exclude.why')) + '</p>'
      + '<button type="button" class="btn btn-outline btn-danger btn-block" id="unbind">' + esc(t('android.unbind')) + '</button></div>';
  }
  function renderTabs(show) {
    tabs.classList.toggle('hidden', !show);
    if (!show) { tabs.innerHTML = ''; return; }
    const item = (id, icon, label) => '<button type="button" data-tab="' + id + '"' + (S.tab === id ? ' aria-current="page"' : '') + '>' + ico(icon) + '<span>' + esc(label) + '</span></button>';
    tabs.innerHTML = item('check', 'pulse', t('android.tab.check')) + item('settings', 'settings', t('android.tab.settings'));
    tabs.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { S.tab = b.getAttribute('data-tab'); render(); }));
  }

  function render() {
    applyTheme();
    const onb = ONB[S.state];
    renderBar(onb);
    renderTabs(!onb);
    steps.innerHTML = onb ? stepper(onb) : '';
    steps.hidden = !onb;
    content.className = 'content' + (onb ? ' stage' : '');
    content.innerHTML = onb ? onboarding(onb) : (S.tab === 'settings' ? settingsTab() : checkTab());
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
    const code = $('#code'); if (code) code.addEventListener('input', () => { S.code = code.value; });
    on('bind', () => { track('android_onboarding_step', { step: 'bind', result: S.code.trim().length >= 8 ? 'ok' : 'error' }); set(S.code.trim().length >= 8 ? 'exclude' : 'bind_error'); if (S.state === 'bind_error') { const c = $('#code'); if (c) c.focus(); } });
    on('excluded', () => { track('android_onboarding_step', { step: 'exclude', result: 'confirmed' }); set('cellular_checking'); setTimeout(() => { if (S.state === 'cellular_checking') { track('android_route_check', { result: 'ok', ip_family: 'v4' }); set('cellular_ok'); } }, 1200); });
    on('retry', () => { set('cellular_checking'); setTimeout(() => { if (S.state === 'cellular_checking') { track('android_route_check', { result: 'ok', ip_family: 'v4' }); set('cellular_ok'); } }, 1200); });
    on('next', () => set('done'));
    on('start', () => { track('android_probe_started', { network_type: 'cellular', vpn_excluded_confirmed: true }); set('running'); });
    on('ring', () => {
      const running = S.state === 'running' || S.state === 'queued';
      if (running) { track('android_probe_stopped', { reason: 'user', duration_bucket: 'short' }); set('stopped'); }
      else { track('android_probe_started', { network_type: 'cellular', vpn_excluded_confirmed: true }); set('running'); }
    });
    on('details', () => { S.details = !S.details; render(); });
    on('settings', () => toast(t('admin.demoAction')));
    on('unbind', () => toast(t('admin.demoAction')));
    try { document.dispatchEvent(new CustomEvent('vpnpulse:render', { detail: { lang: S.lang, state: S.state, tab: S.tab } })); } catch (e) { /* old webview */ }
  }

  window.VPNPulseShowcase = { apply(o) { if (o.state) S.state = o.state; if (o.lang) S.lang = o.lang; if (o.theme) S.theme = o.theme; if (o.text200 !== undefined) S.text200 = o.text200; if (o.showcase) document.body.setAttribute('data-showcase', o.showcase); render(); }, state: () => ({ state: S.state, lang: S.lang, tab: S.tab }), events };
  const sel = document.getElementById('sc-state');
  if (sel) { ['unbound', 'bind_error', 'exclude', 'cellular_checking', 'cellular_ok', 'cellular_fail', 'cellular_nosim', 'done', 'running', 'stopped', 'queued', 'stale', 'permission'].forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); }); sel.value = S.state; sel.addEventListener('change', () => set(sel.value)); }
  document.querySelectorAll('[data-sc-theme]').forEach(b => b.addEventListener('click', () => { S.theme = b.getAttribute('data-sc-theme'); document.querySelectorAll('[data-sc-theme]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); }));
  const tx = document.getElementById('sc-text'); if (tx) tx.addEventListener('click', () => { S.text200 = !S.text200; tx.setAttribute('aria-pressed', String(S.text200)); render(); });
  const hide = document.getElementById('sc-hide'); if (hide) hide.addEventListener('click', () => document.body.setAttribute('data-showcase', 'hidden'));
  render();
})();

</script>

</body>
</html>

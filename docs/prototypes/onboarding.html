<style>
/* VPN Pulse — shared UI tokens (Mini App, onboarding showcase, Android web mock).
   v5 "instrument panel": near-black glass in the dark theme, iOS-clean grouped background in the
   light theme, lamp colours for states, engraved hairlines, gauge rings with flags.
   The palette is the product's own; Telegram only decides light vs dark (colorScheme) and receives
   the background via setHeaderColor. Type scale uses rem so system text scaling (200%) is respected.
   Every colour pair used for text is >= 4.5:1, control boundaries >= 3:1 (scripts/check_contrast.py).

   Surfaces: --color-bg (page) < --color-surface (cards) < --color-raised (selected / lifted);
   --color-well is the recessed track under segmented controls, code and text fields. */
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-xs: 0.75rem;   /* 12 */
  --text-sm: 0.875rem;  /* 14 */
  --text-md: 1rem;      /* 16 */
  --text-lg: 1.25rem;   /* 20 */
  --text-xl: 1.5rem;    /* 24 */
  --lh-tight: 1.2;
  --lh-caption: 1.4;
  --lh-normal: 1.5;
  --control-min: 44px;
  --row-min: 72px;
  --accordion-min: 48px;
  --ring-size: 64px;
  --ring-size-sm: 48px;
  --focus-width: 2px;
  --motion-fast: 140ms;
  --motion-normal: 180ms;
  --content-max: 560px;
  --content-wide: 960px;

  /* light — clean grouped background, white cards, graphite controls */
  --color-bg: #f2f2f7;
  --color-surface: #ffffff;
  --color-raised: #ffffff;
  --color-well: #e5e5ea;
  --color-text: #1c1c1e;
  --color-muted: #66666d;
  --color-accent: #2c2c2e;
  --color-accent-text: #f5f5f7;
  --color-border: rgba(60, 60, 67, 0.14);
  --color-border-strong: rgba(60, 60, 67, 0.6);
  --line-dark: rgba(60, 60, 67, 0.16);
  --line-light: rgba(255, 255, 255, 0.7);
  --color-operational: #14713d;
  --color-degraded: #8a5200;
  --color-unavailable: #b3261e;
  --color-unknown: #5f6670;
  --color-admin: #5b3fc4;
  --tint: 12%;
  --color-focus: var(--color-accent);
  --metal: linear-gradient(180deg, #4d535a 0%, #2f353b 55%, #23282d 100%);
  --metal-pressed: linear-gradient(180deg, #23282d 0%, #2f353b 100%);
  --metal-edge: inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 -1px 0 rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.25);
  --card-edge: 0 0 0 1px rgba(60, 60, 67, 0.08);
  --panel-inset: inset 0 1px 2px rgba(60, 60, 67, 0.12);
  --lamp-glow: 0 0 0 1px rgba(60, 60, 67, 0.08);
  --shadow-float: 0 8px 24px rgba(28, 28, 30, 0.18);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg: #0b0c0e;
    --color-surface: #1c1c1e;
    --color-raised: #2c2c2e;
    --color-well: #131315;
    --color-text: #f5f5f7;
    --color-muted: #9a9aa1;
    --color-accent: #dcdce1;
    --color-accent-text: #0b0c0e;
    --color-border: rgba(255, 255, 255, 0.1);
    --color-border-strong: rgba(255, 255, 255, 0.38);
    --line-dark: rgba(0, 0, 0, 0.6);
    --line-light: rgba(255, 255, 255, 0.08);
    --color-operational: #30d158;
    --color-degraded: #ff9f0a;
    --color-unavailable: #ff453a;
    --color-unknown: #a1a1a8;
    --color-admin: #bf9fff;
    --tint: 16%;
    --metal: linear-gradient(180deg, #eeece8 0%, #d2d3d3 55%, #bfc1c3 100%);
    --metal-pressed: linear-gradient(180deg, #bfc1c3 0%, #d2d3d3 100%);
    --metal-edge: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -1px 0 rgba(0, 0, 0, 0.28), 0 1px 2px rgba(0, 0, 0, 0.55);
    --card-edge: 0 0 0 1px rgba(255, 255, 255, 0.05);
    --panel-inset: inset 0 1px 2px rgba(0, 0, 0, 0.6);
    --lamp-glow: 0 0 6px color-mix(in srgb, currentColor 55%, transparent);
    --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.6);
  }
}

:root[data-theme="dark"] {
  --color-bg: #0b0c0e;
  --color-surface: #1c1c1e;
  --color-raised: #2c2c2e;
  --color-well: #131315;
  --color-text: #f5f5f7;
  --color-muted: #9a9aa1;
  --color-accent: #dcdce1;
  --color-accent-text: #0b0c0e;
  --color-border: rgba(255, 255, 255, 0.1);
  --color-border-strong: rgba(255, 255, 255, 0.38);
  --line-dark: rgba(0, 0, 0, 0.6);
  --line-light: rgba(255, 255, 255, 0.08);
  --color-operational: #30d158;
  --color-degraded: #ff9f0a;
  --color-unavailable: #ff453a;
  --color-unknown: #a1a1a8;
  --color-admin: #bf9fff;
  --tint: 16%;
  --metal: linear-gradient(180deg, #eeece8 0%, #d2d3d3 55%, #bfc1c3 100%);
  --metal-pressed: linear-gradient(180deg, #bfc1c3 0%, #d2d3d3 100%);
  --metal-edge: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -1px 0 rgba(0, 0, 0, 0.28), 0 1px 2px rgba(0, 0, 0, 0.55);
  --card-edge: 0 0 0 1px rgba(255, 255, 255, 0.05);
  --panel-inset: inset 0 1px 2px rgba(0, 0, 0, 0.6);
  --lamp-glow: 0 0 6px color-mix(in srgb, currentColor 55%, transparent);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.6);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-fast: 1ms;
    --motion-normal: 1ms;
  }
}

/* VPN Pulse — Mini App v5 styles ("instrument panel"). Tokens come from ui-tokens.css (inlined at build).
   Materials: graphite / aluminium background, engraved hairlines, brushed-metal primary buttons,
   recessed panels, lamp colours for states. Two font weights only: 400 and 700. */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--color-bg); color: var(--color-text);
  font-family: var(--font-sans); font-size: var(--text-md); line-height: var(--lh-normal);
  overflow: hidden; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: .55; }
:focus { outline: none; }
:focus-visible { outline: var(--focus-width) solid var(--color-focus); outline-offset: 2px; border-radius: var(--radius-sm); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.28em; }
b, strong { font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--color-muted); }
.small { font-size: var(--text-sm); }
.xs { font-size: var(--text-xs); line-height: var(--lh-caption); }
/* engraved rule: a dark edge with a light edge below it */
.rule-b { border-bottom: 1px solid var(--line-dark); box-shadow: 0 1px 0 var(--line-light); }

/* ---------- showcase (not part of the product) ---------- */
.showcase {
  flex: none; background: #1f2430; color: #e6e9ef; font-size: 13px; line-height: 1.3;
  padding: 8px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  border-bottom: 3px dashed #4b5568; font-family: var(--font-mono);
}
.showcase .sc-label { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; color: #9aa4b5; }
.showcase label { display: inline-flex; align-items: center; gap: 6px; }
.showcase select, .showcase button.sc-btn { background: #2b3242; color: #e6e9ef; border: 1px solid #4b5568; border-radius: 6px; padding: 4px 8px; min-height: 32px; font: inherit; }
.showcase button.sc-btn[aria-pressed="true"] { background: #4b7bec; border-color: #4b7bec; color: #fff; }
.showcase .sc-hide { margin-left: auto; }
body[data-showcase="hidden"] .showcase { display: none; }

/* ---------- app shell ---------- */
.app {
  flex: 1; min-height: 0; width: 100%; max-width: var(--content-max); margin: 0 auto;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--color-bg);
}
@media (min-width: 1024px) { .app { max-width: var(--content-wide); } }
.app-header {
  display: grid; grid-template-columns: var(--control-min) minmax(0, 1fr) auto; align-items: center; gap: var(--space-2);
  padding: calc(var(--space-1) + env(safe-area-inset-top, 0px)) var(--space-3) var(--space-1);
  min-height: 56px; background: var(--color-bg); position: relative; z-index: 1;
  border-bottom: 1px solid var(--line-dark); box-shadow: 0 1px 0 var(--line-light);
}
.app-header .ttl { font-size: var(--text-md); font-weight: 700; line-height: var(--lh-tight); min-width: 0; display: flex; align-items: center; gap: var(--space-2); letter-spacing: .01em; }
.app-header .ttl .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-header .ttl .logo { width: 22px; height: 22px; color: var(--color-operational); stroke-width: 2.8; }
.app-header .ttl .st { font-size: var(--text-xs); color: var(--color-muted); font-weight: 400; white-space: nowrap; }
.demo-mark { font-size: var(--text-xs); font-weight: 700; color: var(--color-degraded); border: 1px solid currentColor; border-radius: var(--radius-sm); padding: 1px 6px; white-space: nowrap; }
.icon-btn {
  width: var(--control-min); height: var(--control-min); display: inline-grid; place-items: center;
  border-radius: var(--radius-md); color: var(--color-text); font-size: 20px; transition: background var(--motion-fast);
}
.icon-btn .i { width: 22px; height: 22px; }
.icon-btn:hover { background: var(--color-surface); }
.icon-btn:active { background: var(--color-raised); }
.icon-btn.hidden { visibility: hidden; }
/* machined pill: hairline border with a light top edge (also used by ghost buttons) */
.lang-btn, .btn-ghost {
  border: 1px solid var(--color-border-strong); color: var(--color-text); background: transparent;
  box-shadow: inset 0 1px 0 var(--line-light);
}
.lang-btn { min-width: var(--control-min); height: var(--control-min); padding: 0 var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 700; letter-spacing: .06em; }
.lang-btn:hover, .btn-ghost:hover { background: var(--color-surface); }
.app-scroll {
  overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; -ms-overflow-style: none;
  padding: var(--space-3) var(--space-4) var(--space-5);
}
.app-scroll::-webkit-scrollbar { width: 0; height: 0; }
@media (max-width: 359px) { .app-scroll { padding-left: var(--space-3); padding-right: var(--space-3); } .app-header { padding-left: var(--space-2); padding-right: var(--space-2); } }
.app-nav {
  display: grid; grid-template-columns: repeat(var(--nav-count, 4), minmax(0, 1fr)); gap: var(--space-1);
  padding: var(--space-1) var(--space-2) calc(var(--space-1) + env(safe-area-inset-bottom, 0px));
  background: var(--color-bg); border-top: 1px solid var(--line-light); box-shadow: 0 -1px 0 var(--line-dark); position: relative;
}
.app-nav button {
  min-height: var(--control-min); display: grid; justify-items: center; align-content: center; gap: 2px;
  color: var(--color-muted); font-size: clamp(0.6875rem, var(--text-xs), 14px); font-weight: 400; border-radius: var(--radius-md); padding: 4px 2px; position: relative;
  transition: color var(--motion-fast), background var(--motion-fast);
}
.app-nav button .i { width: 22px; height: 22px; }
.app-nav button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-nav button[aria-current="page"] { color: var(--color-text); font-weight: 700; }
.app-nav button[aria-current="page"]::after { content: ""; position: absolute; left: 30%; right: 30%; top: -1px; height: 2px; background: var(--color-accent); border-radius: 0 0 2px 2px; }
.app-nav button:hover { background: var(--color-surface); }

/* ---------- common blocks ---------- */
.screen { display: grid; gap: var(--space-4); align-content: start; }
h1.title { font-size: var(--text-xl); line-height: 1.2; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
h1.title .lamp { vertical-align: middle; }
h2.sub { font-size: var(--text-lg); line-height: 1.3; font-weight: 700; margin: 0; }
p { margin: 0; }
.stack { display: grid; gap: var(--space-2); }
.divider { border-top: 1px solid var(--line-dark); box-shadow: 0 -1px 0 var(--line-light); }
/* lamp: a small light with a soft glow; colour = state */
.lamp { width: 12px; height: 12px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; box-shadow: var(--lamp-glow); }
.state-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; box-shadow: var(--lamp-glow); }
.btn {
  min-height: var(--control-min); padding: 0 var(--space-4); border-radius: var(--radius-md); font-weight: 700; font-size: var(--text-md);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); transition: background var(--motion-fast), transform var(--motion-fast), box-shadow var(--motion-fast);
  border: 1px solid transparent; text-align: center;
}
.btn:active { transform: scale(.99); }
/* brushed-metal primary: the brightest surface in the dark theme, graphite in the light one */
.btn-primary { background: var(--metal); color: var(--color-accent-text); box-shadow: var(--metal-edge); }
.btn-primary:hover { filter: brightness(1.04); }
.btn-primary:active { background: var(--metal-pressed); box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.35); }
.btn-ghost { border-radius: var(--radius-md); }
.btn-text { color: var(--color-accent); padding: 0 var(--space-2); }
.btn-danger { color: var(--color-unavailable); border-color: color-mix(in srgb, var(--color-unavailable) 55%, transparent); }
.btn-block { width: 100%; }
.btn.loading { pointer-events: none; opacity: .7; }
/* recessed matte panels */
.panel { background: var(--color-surface); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); box-shadow: var(--card-edge); }
.banner { border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: grid; grid-template-columns: auto 1fr; gap: var(--space-3); align-items: start; font-size: var(--text-sm); box-shadow: var(--card-edge); }
.banner .i { width: 20px; height: 20px; margin-top: 1px; }
.banner-warn { background: color-mix(in srgb, var(--color-degraded) var(--tint), var(--color-surface)); color: var(--color-text); }
.banner-warn .i { color: var(--color-degraded); }
.banner-bad { background: color-mix(in srgb, var(--color-unavailable) var(--tint), var(--color-surface)); }
.banner-bad .i { color: var(--color-unavailable); }
.banner-info { background: var(--color-surface); }
.banner-info .i { color: var(--color-muted); }
.banner .act { grid-column: 2; display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-1); }
.kv { display: grid; font-size: var(--text-sm); }
.kv > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); padding: var(--space-2) 0; border-top: 1px solid var(--color-border); align-items: baseline; }
.kv > div:first-child { border-top: 0; }
.kv .k { min-width: 0; }
.kv .k small { display: block; color: var(--color-muted); font-size: var(--text-xs); line-height: var(--lh-caption); margin-top: 1px; }
.kv .v { text-align: right; color: var(--color-muted); white-space: nowrap; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; }
.kv .v.ok { color: var(--color-operational); font-weight: 700; }
.kv .v.bad { color: var(--color-unavailable); font-weight: 700; }
.kv .v.warn { color: var(--color-degraded); font-weight: 700; }
.kv .v.unk { color: var(--color-unknown); font-weight: 700; }
.c-operational { color: var(--color-operational); } .c-degraded { color: var(--color-degraded); } .c-unavailable { color: var(--color-unavailable); } .c-unknown { color: var(--color-unknown); }
.c-ok { color: var(--color-operational); } .c-fail { color: var(--color-unavailable); } .c-partial { color: var(--color-degraded); }
.copy-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2); align-items: center; }
.copy-row code { font-family: var(--font-mono); font-size: var(--text-sm); background: var(--color-well); box-shadow: var(--panel-inset); border-radius: var(--radius-sm); padding: 10px var(--space-3); overflow-x: auto; white-space: nowrap; min-height: var(--control-min); display: flex; align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--color-text); color: var(--color-bg); padding: 10px 14px; border-radius: var(--radius-md); font-size: var(--text-sm); box-shadow: var(--shadow-float); max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity var(--motion-normal); z-index: 20; }
.toast.show { opacity: 1; }

/* ---------- status screen ---------- */
/* status header: one instrument line — lamp, state, freshness chip on the right */
.overall { display: grid; gap: var(--space-2); }
.overall .ov-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: var(--space-3); }
.overall h1.title { min-width: 0; display: flex; align-items: flex-start; gap: 10px; }
/* lamp sits on the first line of the headline (cap height of a 24 px / 1.2 title) */
.overall h1.title .ring.xs { margin-top: -2px; }
.overall .chip-fresh { margin-top: 1px; }
/* chips: machined pill (freshness) and metal plate (recommendation) */
.chip { display: inline-flex; align-items: center; gap: 4px; min-height: 24px; padding: 0 9px; border-radius: 999px; font-size: var(--text-xs); font-weight: 700; line-height: 1; white-space: nowrap; border: 1px solid var(--color-border-strong); color: var(--color-muted); box-shadow: inset 0 1px 0 var(--line-light); vertical-align: middle; }
.chip .i { width: 14px; height: 14px; }
.chip-fresh { min-height: 28px; padding: 0 10px; font-weight: 400; font-variant-numeric: tabular-nums; }
.chip-fresh > span[aria-hidden] { display: inline-flex; align-items: center; gap: 5px; }
.chip-fresh.stale { color: var(--color-degraded); border-color: color-mix(in srgb, var(--color-degraded) 60%, transparent); }
.chip-rec { background: var(--metal); color: var(--color-accent-text); border-color: transparent; box-shadow: var(--metal-edge); letter-spacing: .02em; }
.chip-rec .i { fill: currentColor; stroke: none; width: 12px; height: 12px; }
.note-box { background: var(--color-surface); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: grid; gap: var(--space-1); border-left: 3px solid var(--color-accent); box-shadow: var(--card-edge); }
.note-box .txt { font-size: var(--text-sm); line-height: var(--lh-normal); }
.note-box .txt.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.note-box .who { font-size: var(--text-xs); color: var(--color-muted); }
.note-box .btn-text { justify-self: start; min-height: 36px; margin-left: calc(-1 * var(--space-2)); }
.hint { display: grid; grid-template-columns: 1fr auto; gap: var(--space-2); align-items: center; font-size: var(--text-sm); color: var(--color-muted); background: var(--color-surface); box-shadow: var(--card-edge); border-radius: var(--radius-md); padding: var(--space-1) var(--space-1) var(--space-1) var(--space-3); }
.hint .btn { min-height: 40px; color: var(--color-text); }
/* legend plate: three equal cells, icon above the label, so long labels never break mid-row */
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: var(--space-2); font-size: var(--text-xs); line-height: var(--lh-caption); color: var(--color-muted); padding: var(--space-2) 0; border-top: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border); }
.legend > span { display: grid; justify-items: center; gap: 3px; text-align: center; min-width: 0; }
.legend .src { gap: 5px; }
.legend .src .i { width: 18px; height: 18px; }
.legend .lg-t { max-width: 100%; }
@media (min-width: 1024px) { .legend { display: none; } }
.servers { display: grid; }
.srow {
  display: grid; grid-template-columns: var(--ring-size) minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; width: 100%;
  min-height: 112px; padding: var(--space-3) var(--space-1); text-align: left;
  border-radius: var(--radius-md); transition: background var(--motion-fast), transform var(--motion-fast); position: relative;
}
/* straight hairline between rows (a border would follow the rounded corners) */
.srow::before { content: ""; position: absolute; left: var(--space-1); right: var(--space-1); top: 0; height: 1px; background: var(--color-border); }
.srow:first-child::before { display: none; }

  // ---------- producer 2: contract payloads ----------

  function apiServer(card, detail, metrics, adminDetail, ctx) {
    const lang = ctx.lang, now = ctx.now, d = detail || {};
    const s = { id: card.id, name: card.name, cc: (card.country_code || '').toLowerCase(), countryFallback: card.country_code, state: card.state };
    s.uptime24n = card.uptime_24h === undefined ? null : card.uptime_24h; s.uptime7n = d.uptime_7d === undefined ? null : d.uptime_7d;
    s.staleMin = card.freshness && card.freshness.is_stale && card.freshness.observed_at ? minutesSince(card.freshness.observed_at, now) : undefined;

    s.conflict = conflictOf(s.state, s.sources, humans);

    me: () => call('GET', '/sessions/current'),

  function applyShowcase(o) {
    let reload = false;
    if (o.scenario) { S.scenario = o.scenario; S.eventsState = 'ok'; S.eventsPage = 1; noteDraft = null; reload = true; }
    if (o.role) { S.role = o.role; S.sessionRole = null; if (S.role !== 'admin' && S.tab === 'admin') S.tab = 'status'; reload = true; }
    if (o.theme) S.theme = o.theme;
    if (o.lang) { S.lang = o.lang; store.set('lang', S.lang); reload = true; }
    if (o.text200 !== undefined) S.text200 = o.text200;
    if (o.showcase) document.body.setAttribute('data-showcase', o.showcase);
    if (o.screen) { const m = o.screen.match(/^server:(\w+)$/); if (m) { S.tab = 'status'; S.server = m[1]; S.open = 'checks'; } else { S.tab = o.screen; S.server = null; } }
    const p = reload ? load() : (render(), Promise.resolve());
    syncShowcase();
    return p;
  }
  function syncShowcase() {
    const sc = document.getElementById('sc-scenario'); if (sc) sc.value = S.scenario;
    document.querySelectorAll('[data-sc-role]').forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute('data-sc-role') === S.role)));
    document.querySelectorAll('[data-sc-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute('data-sc-theme') === S.theme)));
    const tx = document.getElementById('sc-text'); if (tx) tx.setAttribute('aria-pressed', String(S.text200));
  }
  window.VPNPulseShowcase = { apply: applyShowcase, reload: load, mode: MODE, state: () => JSON.parse(JSON.stringify({ scenario: S.scenario, role: S.role, theme: S.theme, lang: S.lang, tab: S.tab, server: S.server, open: S.open, scrollPos: S.scrollPos, source: SC.source })), events, analytics: () => ({ queued: analytics.queue.length, sent: analytics.sent }), flush: flushAnalytics };
  const scSel = document.getElementById('sc-scenario');
  if (scSel) { Object.keys(FX.scenarios).forEach(id => { if (MODE === 'api' && id === 'loading') return; const o = document.createElement('option'); o.value = id; o.textContent = id; scSel.appendChild(o); }); scSel.addEventListener('change', () => applyShowcase({ scenario: scSel.value })); }
  document.querySelectorAll('[data-sc-role]').forEach(b => b.addEventListener('click', () => applyShowcase({ role: b.getAttribute('data-sc-role') })));
  document.querySelectorAll('[data-sc-theme]').forEach(b => b.addEventListener('click', () => applyShowcase({ theme: b.getAttribute('data-sc-theme') })));
  const scText = document.getElementById('sc-text'); if (scText) scText.addEventListener('click', () => applyShowcase({ text200: !S.text200 }));
  const scHide = document.getElementById('sc-hide'); if (scHide) scHide.addEventListener('click', () => applyShowcase({ showcase: 'hidden' }));
  const scLabel = document.querySelector('.showcase .sc-label'); if (scLabel && MODE === 'api') scLabel.textContent = 'Showcase · API';

  // ---------- boot ----------
  history.replaceState({ tab: S.tab, server: S.server }, '');
  if (S.server) history.pushState({ tab: 'status', server: S.server }, '');
  render(); syncShowcase();
  if (MODE !== 'api') document.body.setAttribute('data-load', 'ready');
  ensureSession().catch(() => {}).finally(() => track('app_opened', { role: S.role, language: S.lang, theme: S.theme, viewport_bucket: window.innerWidth < 480 ? 'phone' : window.innerWidth < 1024 ? 'tablet' : 'desktop' }));
  if (MODE === 'api') { load().then(() => { if (!SC.loading && SC.api !== 'auth') track('status_ready', { overall_state: SC.overall, freshness_bucket: SC.freshnessMin === null ? 'none' : SC.freshnessMin <= 3 ? 'fresh' : 'stale', load_ms: 0, coverage: SC.coverageMissing ? 'partial' : 'full' }); }); scheduleRefresh(); }
  else if (!SC.loading && SC.api !== 'auth') track('status_ready', { overall_state: SC.overall, freshness_bucket: SC.freshnessMin === null ? 'none' : SC.freshnessMin <= 3 ? 'fresh' : 'stale', load_ms: 0, coverage: SC.coverageMissing ? 'partial' : 'full' });
})();

</script>
<script>
(function () {
  const I = window.__I18N; let lang = (window.VPNPulseShowcase.state().lang) || 'ru'; let active = 'demo';
  const t = k => (I[lang][k] !== undefined ? I[lang][k] : k);
  const states = {
    demo: { cmd: './install.sh demo', views: [['member', { scenario: 'demo', role: 'member', screen: 'status' }], ['admin', { scenario: 'demo', role: 'admin', screen: 'admin' }]] },
    clean: { cmd: 'vpn-pulse server add', views: [['member', { scenario: 'clean_install', role: 'member', screen: 'status' }], ['admin', { scenario: 'clean_install', role: 'admin', screen: 'status' }]] },
    partial: { cmd: 'vpn-pulse probe enroll pc', views: [['member', { scenario: 'partial_coverage', role: 'member', screen: 'status' }], ['admin', { scenario: 'partial_coverage', role: 'admin', screen: 'admin' }]] },
    doctor: { cmd: 'vpn-pulse doctor', views: [['ok', { scenario: 'operational', role: 'admin', screen: 'admin' }], ['warn', { scenario: 'partial_coverage', role: 'admin', screen: 'admin' }], ['fail', { scenario: 'clean_install', role: 'admin', screen: 'admin' }]] }
  };
  let activeView = 'member';
  function render() {
    const g = document.getElementById('guide');
    g.innerHTML = '<div class="in"><div style="display:flex;align-items:center;gap:8px"><h1>' + t('onboarding.title') + '</h1><button type="button" class="g-btn lang" id="g-lang">' + (lang === 'ru' ? 'EN' : 'RU') + '</button></div><p>' + t('onboarding.intro') + '</p>' +
      Object.keys(states).map(id => '<section class="card" data-active="' + (active === id) + '"><h2>' + t('onboarding.' + id) + '</h2><p>' + t('onboarding.' + id + 'Body') + '</p><div class="row">' +
        states[id].views.map(([v, cfg]) => '<button type="button" class="g-btn" data-state="' + id + '" data-view="' + v + '" aria-pressed="' + (active === id && activeView === v) + '">' + (v === 'member' ? t('onboarding.memberView') : v === 'admin' ? t('onboarding.adminView') : t('admin.doctor.' + v)) + '</button>').join('') +
        '</div><div><div class="foot">' + t('onboarding.next') + '</div><code>' + states[id].cmd + '</code></div></section>').join('') +
      '<p class="foot">Showcase · fixtures only · ' + t('app.demo') + '</p></div>';
    g.querySelectorAll('[data-state]').forEach(b => b.addEventListener('click', () => { active = b.getAttribute('data-state'); activeView = b.getAttribute('data-view'); const cfg = states[active].views.find(x => x[0] === activeView)[1]; window.VPNPulseShowcase.apply(Object.assign({ lang }, cfg)); render(); }));
    document.getElementById('g-lang').addEventListener('click', () => { lang = lang === 'ru' ? 'en' : 'ru'; window.VPNPulseShowcase.apply({ lang }); render(); });
  }
  document.addEventListener('vpnpulse:render', e => { if (e.detail && e.detail.lang !== lang) { lang = e.detail.lang; render(); } });
  window.VPNPulseShowcase.apply({ scenario: 'demo', role: 'member', screen: 'status', showcase: 'hidden' });
  render();
})();
</script>

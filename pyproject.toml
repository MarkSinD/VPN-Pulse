[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-pulse"
version = "0.1.0"
description = "Telegram Mini App and bot that shows whether your self-hosted VPN servers are reachable, confirmed by independent checks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "FastAPI>=0.135,<1",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "pydantic>=2.12,<3",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9"]

[project.scripts]
vpn-pulse = "vpnpulse.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/MarkSinD/VPN-Pulse"
Issues = "https://github.com/MarkSinD/VPN-Pulse/issues"

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: tests, contracts, links, private-data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Backend and contract tests
        run: python -m pytest
      - name: Contracts and RU/EN dictionaries
        run: python scripts/validate_specs.py
      - name: Prototypes rebuild is reproducible
        run: python scripts/build_prototypes.py && git diff --exit-code -- docs/prototypes
      - name: Design tokens keep WCAG contrast
        run: python scripts/check_contrast.py
      - name: Relative Markdown links
        run: python scripts/check_links.py
      - name: Private data scan (tree and history)
        run: python scripts/check_public_tree.py --history

  browser:
    name: browser QA and API parity (Playwright)
    runs-on: ubuntu-latest
    # font metrics differ from the Windows machine the matrix was tuned on: advisory until the
    # first green run on Linux, then promote to blocking
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package, Playwright and Chromium
        run: python -m pip install --upgrade pip && pip install -e ".[dev]" playwright && playwright install --with-deps chromium
      - name: Browser QA matrix
        run: python scripts/ui_check.py
      - name: API render equals scenario render
        run: python scripts/ui_parity_check.py

  install:
    name: install.sh on a clean Ubuntu (fresh, idempotent, upgrade, rollback, uninstall)
    runs-on: ubuntu-24.04
    # the runner is a real Ubuntu with systemd: services are started and checked; advisory until the
    # first green run, then promote to blocking (release gate 2-3 of docs/operations)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fresh install → doctor OK → repeat → upgrade → rollback → uninstall
        run: sudo -E bash scripts/install_check.sh

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
